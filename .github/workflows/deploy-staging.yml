name: Deploy to staging

# Manual dispatch or push to `staging` -> build both app images tagged :staging
# -> push to GHCR -> SSH into the same Bangalore droplet and bring up ONLY the
# staging stack (docker-compose.staging.yml). The prod stack (docker-compose.yml)
# is never pulled, restarted, or otherwise touched by this workflow — the only
# thing prod-side that changes is a `caddy reload` to pick up new staging vhosts
# in the Caddyfile, which does not interrupt in-flight prod traffic.
#
# Requires: DNS for staging.delfee.in / api-staging.delfee.in pointed at the
# droplet, and backend-staging.env / staging.env already present in /opt/delfee
# (staging Supabase DATABASE_URL, Razorpay TEST keys, SHIPROCKET_SIMULATE=true,
# NODE_ENV=staging — see deploy/docker-compose.staging.yml for the full list).

on:
  push:
    branches: [staging]
    paths:
      - "backend/**"
      - "backend-storefront/**"
      - "deploy/docker-compose.staging.yml"
      - "deploy/Caddyfile"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: deploy-staging
  cancel-in-progress: true # OK to interrupt an in-flight staging deploy with a newer one

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/delfeejewel/delfee-backend
  STOREFRONT_IMAGE: ghcr.io/delfeejewel/delfee-storefront

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend (staging)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:staging
            ${{ env.BACKEND_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

  build-storefront:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push storefront (staging, NEXT_PUBLIC_* baked at build time)
        uses: docker/build-push-action@v6
        with:
          context: ./backend-storefront
          file: ./backend-storefront/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.STOREFRONT_IMAGE }}:staging
            ${{ env.STOREFRONT_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=storefront-staging
          cache-to: type=gha,mode=max,scope=storefront-staging
          build-args: |
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.STAGING_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ secrets.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ secrets.STAGING_NEXT_PUBLIC_MEDUSA_BACKEND_URL }}

  deploy:
    needs: [build-backend, build-storefront]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the droplet's staging compose file + Caddyfile in sync with the repo.
      # Prod's docker-compose.yml is intentionally NOT copied by this workflow.
      - name: Copy staging compose file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: deploy/docker-compose.staging.yml
          target: /opt/delfee
          strip_components: 1

      - name: Copy Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: deploy/Caddyfile
          target: /opt/delfee
          strip_components: 1

      - name: Pull staging images & restart ONLY the staging stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/delfee

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            if [ ! -f backend-staging.env ] || [ ! -f staging.env ]; then
              echo "Missing backend-staging.env / staging.env in /opt/delfee — create them before the first staging deploy (see deploy/docker-compose.staging.yml comments)." >&2
              exit 1
            fi

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f

            # Reload Caddy (from the PROD stack) to pick up the staging vhosts.
            # `caddy reload` is a hot config swap — no downtime for prod traffic.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Health check (staging storefront + API)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            check() {
              local url="$1"
              local cj; cj=$(mktemp)
              for i in $(seq 1 30); do
                code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 \
                  -c "$cj" -b "$cj" --max-time 15 "$url" || echo 000)
                if [ "$code" = "200" ]; then echo "OK  $url"; rm -f "$cj"; return 0; fi
                echo "...waiting ($code) $url [$i/30]"; sleep 5
              done
              echo "FAIL $url never returned 200"; rm -f "$cj"; return 1
            }
            check https://api-staging.delfee.in/health
            check https://staging.delfee.in/in
